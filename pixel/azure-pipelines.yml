# Azure DevOps CI/CD pipeline for Pixel Dash
# Build stage: pulls code from GitHub, builds a Docker image, pushes it to ACR
# Release stage: deploys that image to Azure App Service (Web App for Containers)
#
# Before running this pipeline, update the variables below with your own
# resource names, and make sure the two service connections exist in
# Project settings -> Service connections:
#   1. An "Azure Container Registry" (or Docker Registry) connection -> dockerRegistryServiceConnection
#   2. An "Azure Resource Manager" connection -> azureSubscription

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # ---- EDIT THESE ----
  dockerRegistryServiceConnection: '<your-acr-service-connection-name>'
  imageRepository: 'pixel-dash'
  containerRegistry: '<your-acr-name>.azurecr.io'
  azureSubscription: '<your-azure-rm-service-connection-name>'
  appServiceName: '<your-app-service-name>'
  # ---------------------
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build and push image to ACR
    jobs:
      - job: Build
        displayName: Build
        steps:
          - task: Docker@2
            displayName: Build and push image to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: Release
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy image to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(appServiceName)
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'
