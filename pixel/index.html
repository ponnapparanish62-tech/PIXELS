<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pixel Dash</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --accent:#00e0a4; --accent2:#ff5c8a;
  --text:#e6edf3; --muted:#8b949e; --danger:#ff4d5e; --grid:#1f2733;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f6f8; --panel:#ffffff; --accent:#0a9d6f; --accent2:#d1245e;
    --text:#1a1f26; --muted:#5b6572; --danger:#d1245e; --grid:#e2e6ea;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --accent:#00e0a4; --accent2:#ff5c8a;
  --text:#e6edf3; --muted:#8b949e; --danger:#ff4d5e; --grid:#1f2733;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh; padding:24px 16px 40px;
}
.wrap{ width:100%; max-width:520px; }
header{ text-align:center; margin-bottom:14px; }
h1{ font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:0.5px; }
h1 span{ color:var(--accent); }
p.sub{ color:var(--muted); font-size:13px; margin:0; }
.hud{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--panel); border:1px solid var(--grid); border-radius:10px;
  padding:10px 16px; margin-bottom:10px; font-size:14px;
}
.hud .stat{ text-align:center; }
.hud .stat .val{ font-size:18px; font-weight:700; color:var(--accent); }
.hud .stat .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
#gameCanvas{
  width:100%; display:block; background:linear-gradient(180deg, var(--panel), var(--bg));
  border:1px solid var(--grid); border-radius:12px; touch-action:none;
}
.controls{
  display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap;
}
button{
  background:var(--panel); color:var(--text); border:1px solid var(--grid);
  border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600;
  cursor:pointer; transition:transform .1s ease, border-color .15s ease;
}
button:hover{ border-color:var(--accent); }
button:active{ transform:scale(0.96); }
button.primary{ background:var(--accent); color:#04241a; border-color:var(--accent); }
:root[data-theme="dark"] button.primary, :root:not([data-theme="light"]) button.primary { color:#04241a; }
.hint{ text-align:center; color:var(--muted); font-size:12px; margin-top:10px; line-height:1.6; }
.overlay-msg{
  text-align:center; font-size:13px; color:var(--muted); margin-top:8px; min-height:18px;
}
.overlay-msg.game-over{ color:var(--danger); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pixel <span>Dash</span></h1>
    <p class="sub">Dodge the blocks. Grab the coins. Survive.</p>
  </header>

  <div class="hud">
    <div class="stat"><div class="val" id="scoreVal">0</div><div class="lbl">Score</div></div>
    <div class="stat"><div class="val" id="bestVal">0</div><div class="lbl">Best</div></div>
    <div class="stat"><div class="val" id="speedVal">1.0x</div><div class="lbl">Speed</div></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <button class="primary" id="startBtn">Start game</button>
    <button id="pauseBtn">Pause</button>
  </div>

  <div class="overlay-msg" id="msg"></div>
  <p class="hint">Desktop: arrow keys or A / D to move, space to jump.<br>Mobile: swipe left / right, tap to jump.</p>
</div>

<script>
(function(){
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('scoreVal');
  var bestEl = document.getElementById('bestVal');
  var speedEl = document.getElementById('speedVal');
  var msgEl = document.getElementById('msg');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');

  var LANES = 3;
  var W = 480, H = 640;
  function resize(){
    var cssW = canvas.clientWidth || 480;
    var ratio = H / W;
    canvas.width = W;
    canvas.height = H;
    canvas.style.height = (cssW * ratio) + 'px';
  }
  window.addEventListener('resize', resize);

  var best = 0;
  try {
    var saved = localStorage.getItem('pixelDashBest');
    if (saved) best = parseInt(saved, 10) || 0;
  } catch(e) {}
  bestEl.textContent = best;

  var state = {
    running:false, paused:false, over:false,
    lane:1, targetX:0, playerX:0, playerY:0,
    obstacles:[], coins:[], particles:[],
    score:0, dist:0, speed:1, baseSpeed:220,
    jumpT:0, isJumping:false,
    spawnTimer:0, coinTimer:0,
  };

  var laneW = W / LANES;
  function laneX(l){ return laneW * l + laneW/2; }

  function resetState(){
    state.running = true; state.paused = false; state.over = false;
    state.lane = 1; state.playerX = laneX(1); state.targetX = laneX(1);
    state.playerY = H - 110;
    state.obstacles = []; state.coins = []; state.particles = [];
    state.score = 0; state.dist = 0; state.speed = 1;
    state.jumpT = 0; state.isJumping = false;
    state.spawnTimer = 0; state.coinTimer = 0;
    msgEl.textContent = '';
    msgEl.classList.remove('game-over');
  }

  function moveLane(dir){
    if(!state.running || state.paused || state.over) return;
    var nl = state.lane + dir;
    if(nl < 0 || nl > LANES-1) return;
    state.lane = nl;
    state.targetX = laneX(nl);
  }

  function jump(){
    if(!state.running || state.paused || state.over) return;
    if(!state.isJumping){
      state.isJumping = true;
      state.jumpT = 0;
    }
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
    else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
    else if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){ e.preventDefault(); jump(); }
  });

  var touchStartX = null, touchStartY = null;
  canvas.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if(touchStartX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30){
      moveLane(dx > 0 ? 1 : -1);
    } else if(dy < -20 || Math.abs(dx) < 30){
      jump();
    }
    touchStartX = null; touchStartY = null;
  }, {passive:true});

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  var lastT = null;
  function loop(ts){
    if(lastT === null) lastT = ts;
    var dt = Math.min((ts - lastT)/1000, 0.05);
    lastT = ts;

    if(state.running && !state.paused && !state.over){
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    state.dist += state.baseSpeed * state.speed * dt;
    state.speed = 1 + Math.min(state.dist / 4000, 2.2);
    speedEl.textContent = state.speed.toFixed(1) + 'x';

    state.playerX += (state.targetX - state.playerX) * Math.min(dt*10, 1);

    if(state.isJumping){
      state.jumpT += dt;
      var dur = 0.55;
      if(state.jumpT >= dur){ state.isJumping = false; state.jumpT = 0; }
    }

    state.spawnTimer -= dt;
    if(state.spawnTimer <= 0){
      spawnObstacle();
      state.spawnTimer = Math.max(0.55, 1.3 - state.speed*0.18);
    }
    state.coinTimer -= dt;
    if(state.coinTimer <= 0){
      spawnCoin();
      state.coinTimer = 0.9 + Math.random()*0.8;
    }

    var moveY = state.baseSpeed * state.speed * dt;
    for(var i=state.obstacles.length-1;i>=0;i--){
      var o = state.obstacles[i];
      o.y += moveY;
      if(o.y > H+60){ state.obstacles.splice(i,1); continue; }
      if(!state.isJumping || o.tall){
        var pw=40, ph=54;
        var px = state.playerX - pw/2, py = state.playerY - ph;
        if(rectsOverlap(px,py,pw,ph, o.x-o.w/2, o.y-o.h/2, o.w, o.h)){
          if(state.isJumping && !o.tall){
            // safe
          } else {
            gameOver();
            return;
          }
        }
      }
    }

    for(var j=state.coins.length-1;j>=0;j--){
      var c = state.coins[j];
      c.y += moveY;
      if(c.y > H+30){ state.coins.splice(j,1); continue; }
      var pw2=40, ph2=54;
      var px2 = state.playerX - pw2/2, py2 = state.playerY - ph2;
      if(rectsOverlap(px2,py2,pw2,ph2, c.x-12, c.y-12, 24,24)){
        state.coins.splice(j,1);
        state.score += 10;
        scoreEl.textContent = state.score;
        spawnParticles(c.x, c.y);
      }
    }

    state.score += Math.floor(moveY * 0.02);
    scoreEl.textContent = state.score;

    for(var k=state.particles.length-1;k>=0;k--){
      var p = state.particles[k];
      p.life -= dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt;
      if(p.life <= 0) state.particles.splice(k,1);
    }
  }

  function spawnObstacle(){
    var lane = Math.floor(Math.random()*LANES);
    var tall = Math.random() < 0.3;
    state.obstacles.push({
      x: laneX(lane), y: -40,
      w: tall ? 50 : 46, h: tall ? 70 : 38,
      tall: tall
    });
  }
  function spawnCoin(){
    var lane = Math.floor(Math.random()*LANES);
    state.coins.push({x: laneX(lane), y:-20});
  }
  function spawnParticles(x,y){
    for(var i=0;i<8;i++){
      state.particles.push({
        x:x, y:y, life:0.4+Math.random()*0.3,
        vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200-80
      });
    }
  }

  function gameOver(){
    state.over = true; state.running = false;
    if(state.score > best){
      best = state.score;
      bestEl.textContent = best;
      try{ localStorage.setItem('pixelDashBest', String(best)); }catch(e){}
      msgEl.textContent = 'New best! ' + state.score + ' points. Tap Start game to play again.';
    } else {
      msgEl.textContent = 'Crashed at ' + state.score + ' points. Tap Start game to try again.';
    }
    msgEl.classList.add('game-over');
  }

  function drawRoundedRect(x,y,w,h,r,fill){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function getVar(name){
    return getComputedStyle(document.body).getPropertyValue(name).trim() || '#00e0a4';
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var gridColor = getVar('--grid');
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for(var l=1;l<LANES;l++){
      var x = laneW*l;
      ctx.beginPath();
      ctx.setLineDash([6,10]);
      ctx.moveTo(x,0); ctx.lineTo(x,H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    var accent = getVar('--accent');
    var accent2 = getVar('--accent2');
    var textColor = getVar('--text');

    for(var i=0;i<state.obstacles.length;i++){
      var o = state.obstacles[i];
      drawRoundedRect(o.x-o.w/2, o.y-o.h/2, o.w, o.h, 8, o.tall ? accent2 : '#5b6572');
    }
    for(var j=0;j<state.coins.length;j++){
      var c = state.coins[j];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10, 0, Math.PI*2);
      ctx.fillStyle = '#ffd24d';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(c.x, c.y, 5, 0, Math.PI*2);
      ctx.fillStyle = '#b98a00';
      ctx.fill();
    }
    for(var k=0;k<state.particles.length;k++){
      var p = state.particles[k];
      ctx.globalAlpha = Math.max(p.life/0.7, 0);
      ctx.beginPath();
      ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fillStyle = '#ffd24d';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    var jumpOffset = 0;
    if(state.isJumping){
      var t = state.jumpT/0.55;
      jumpOffset = Math.sin(Math.min(t,1)*Math.PI) * 90;
    }
    var pw=40, ph=54;
    var px = state.playerX - pw/2;
    var py = state.playerY - ph - jumpOffset;

    if(jumpOffset > 4){
      ctx.beginPath();
      ctx.ellipse(state.playerX, state.playerY+6, 18, 6, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fill();
    }

    drawRoundedRect(px, py, pw, ph, 10, accent);
    ctx.fillStyle = getVar('--bg');
    ctx.beginPath();
    ctx.arc(px+pw/2-9, py+16, 4, 0, Math.PI*2);
    ctx.arc(px+pw/2+9, py+16, 4, 0, Math.PI*2);
    ctx.fill();

    if(!state.running && !state.over){
      ctx.fillStyle = textColor;
      ctx.globalAlpha = 0.85;
      ctx.font = '600 20px -apple-system, Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Tap Start game to begin', W/2, H/2);
      ctx.globalAlpha = 1;
    }
    if(state.paused){
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff';
      ctx.font = '700 26px -apple-system, Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Paused', W/2, H/2);
    }
  }

  startBtn.addEventListener('click', function(){
    resetState();
    pauseBtn.textContent = 'Pause';
  });
  pauseBtn.addEventListener('click', function(){
    if(!state.running || state.over) return;
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
